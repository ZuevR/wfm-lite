# Prometheus стенда. Сервисы живут на хосте (yarn dev), Prometheus — в Docker,
# поэтому цели — host.docker.internal (Docker Desktop; на Linux — через extra_hosts в compose).
global:
  # 5 с — для локального стенда, чтобы эффект эксперимента был виден сразу. На проде обычно 15–30 с.
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: wfm
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3001']
        labels: { app: channel-simulator }
      - targets: ['host.docker.internal:3002']
        labels: { app: realtime-gateway }
      - targets: ['host.docker.internal:3003']
        labels: { app: forecast-service }
