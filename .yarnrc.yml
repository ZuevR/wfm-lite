# Yarn 4 (Berry). Версия зафиксирована в package.json → "packageManager", её ставит corepack.

# node-modules вместо Plug'n'Play: NestJS, Vite, vitest, eslint работают без патчей и IDE-SDK.
# PnP строже (нет «фантомных» зависимостей) и быстрее, но для проекта такого размера не стоит трения.
nodeLinker: node-modules

enableTelemetry: false
